<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#050505" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<title>Arnaud Michel — Portfolio</title>
<style>
/* =========================================================================
   Concept « Relevé » — une source de faits, trois lectures.
   DA reprise telle quelle de PROJECT-STATE.md §2 : noir et blanc strict,
   Avenir Next, titres 800 uppercase + outline, verre dépoli, curseur anneau.
   Aucune dépendance, aucune requête tierce.
   ========================================================================= */
:root {
  --bg: #050505;
  --ink: #f5f5f5;
  --ink-dim: #8a8a8a;
  --line: rgba(255, 255, 255, 0.14);
  --glass: rgba(255, 255, 255, 0.03);
  --ease: cubic-bezier(0.2, 0.75, 0.2, 1);
  font-size: clamp(15px, 1.1vw, 18px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }

/* ---------- curseur anneau (pointeur fin uniquement) ---------- */
@media (pointer: fine) {
  body, a, button, [role="radio"], [role="tab"], .seg { cursor: none; }
  .cursor {
    position: fixed; top: 0; left: 0; z-index: 200; pointer-events: none;
    opacity: 0; transition: opacity 0.35s ease; will-change: transform;
  }
  .cursor.is-visible { opacity: 1; }
  .cursor-ring {
    display: block; width: clamp(1.6rem, 2vw, 2rem); height: clamp(1.6rem, 2vw, 2rem);
    border: 1px solid rgba(245, 245, 245, 0.55); border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.32s var(--ease), height 0.32s var(--ease), background 0.32s ease, border-color 0.32s ease;
  }
  .cursor.is-hover .cursor-ring {
    width: clamp(3.4rem, 5vw, 4.4rem); height: clamp(3.4rem, 5vw, 4.4rem);
    background: rgba(245, 245, 245, 0.08); border-color: rgba(245, 245, 245, 0.9);
  }
  .cursor.is-down .cursor-ring { transform: translate(-50%, -50%) scale(0.82); }
}
@media (pointer: coarse) { .cursor { display: none; } }

/* ---------- loader : chargement de page uniquement ---------- */
.loader {
  position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
  background: var(--bg); transition: opacity 0.7s ease, visibility 0.7s ease;
}
.loader.is-done { opacity: 0; visibility: hidden; }
.loader-inner { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
.loader-logo {
  font-size: clamp(3rem, 9vw, 5.5rem); font-weight: 800; letter-spacing: 0.02em;
  animation: loaderLogo 0.8s var(--ease) both;
}
@keyframes loaderLogo {
  from { opacity: 0; transform: translateY(14px) scale(0.96); letter-spacing: 0.35em; }
  to { opacity: 1; transform: none; letter-spacing: 0.02em; }
}
.loader-bar { display: block; width: clamp(120px, 20vw, 200px); height: 2px; background: var(--line); overflow: hidden; }
.loader-bar-fill {
  display: block; height: 100%; background: var(--ink); transform: scaleX(0); transform-origin: left;
  animation: loaderBar 1.15s cubic-bezier(0.5, 0, 0.2, 1) forwards;
}
@keyframes loaderBar { to { transform: scaleX(1); } }
.dot-dim { color: var(--ink-dim); }

/* ---------- header ---------- */
.site-header {
  position: fixed; z-index: 10; top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 1.6rem; padding: 1.1rem 6vw;
  border-bottom: 1px solid transparent;
  transition: background 0.35s ease, backdrop-filter 0.35s ease, border-color 0.35s ease;
}
.site-header.is-scrolled {
  background: rgba(10, 10, 14, 0.5);
  backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border-bottom-color: var(--line);
}
.brand { font-weight: 800; font-size: 1.2rem; letter-spacing: 0.04em; text-decoration: none; }
.site-header nav { display: flex; gap: 1.4rem; margin-left: auto; }
.site-header nav a {
  color: var(--ink-dim); text-decoration: none; font-size: 0.82rem;
  letter-spacing: 0.08em; text-transform: uppercase; transition: color 0.2s;
}
.site-header nav a:hover { color: var(--ink); }
.pill-group {
  display: inline-flex; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 999px; overflow: hidden;
  background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.pill-group button {
  background: transparent; border: 0; color: var(--ink-dim); font-size: 0.72rem; font-weight: 700;
  letter-spacing: 0.08em; padding: 0.4rem 0.7rem; transition: background 0.2s, color 0.2s;
}
.pill-group button:hover { color: var(--ink); }
.pill-group button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.sobriety-btn {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2); color: var(--ink-dim); border-radius: 999px;
  padding: 0.45rem 0.9rem; font-size: 0.75rem; letter-spacing: 0.06em;
  transition: border-color 0.2s, color 0.2s;
}
.sobriety-btn:hover { border-color: rgba(255, 255, 255, 0.5); color: var(--ink); }
.sobriety-btn .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--ink);
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.8); transition: background 0.2s, box-shadow 0.2s;
}
body.sober .sobriety-btn .dot { background: #666; box-shadow: none; }

/* ---------- hero ---------- */
.hero {
  min-height: 100svh; display: grid;
  grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
  grid-template-rows: auto auto 1fr;
  column-gap: clamp(2rem, 5vw, 5rem);
  padding: clamp(5.8rem, 11vh, 8rem) 6vw 0;
}
.kicker-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.8rem 1.6rem; margin-bottom: 1.4rem; }
.kicker { color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.3em; font-size: 0.75rem; }
.status {
  display: inline-flex; align-items: center; gap: 0.6rem; font-size: 0.75rem;
  letter-spacing: 0.15em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 999px; padding: 0.35rem 0.9rem;
  background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.status::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink);
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.7); animation: breathe 2.4s ease-in-out infinite;
}
@keyframes breathe { 50% { opacity: 0.35; } }
.hero h1 {
  font-size: clamp(3.4rem, 8.4vw, 7.8rem); line-height: 0.92; font-weight: 800;
  letter-spacing: -0.01em; text-transform: uppercase;
}
.outline { color: transparent; -webkit-text-stroke: 2px var(--ink); }

/* sélecteur de lecture */
.lens { margin-top: clamp(1.5rem, 2.8vh, 2.2rem); display: flex; flex-wrap: wrap; align-items: center; gap: 0.7rem 1rem; }
.lens-label { color: var(--ink-dim); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; }
.seg {
  position: relative; display: inline-flex; padding: 4px; border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.seg-thumb {
  position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 999px; background: var(--ink);
  transition: transform 0.45s var(--ease), width 0.45s var(--ease);
}
.seg button {
  position: relative; z-index: 1; background: transparent; border: 0; border-radius: 999px;
  padding: 0.55rem 1.05rem; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; transition: color 0.3s ease;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-checked="true"] { color: var(--bg); }
.seg .short { display: none; }

.pitch { margin-top: 1.6rem; max-width: 36rem; }
.pitch-role { font-size: clamp(1.05rem, 1.6vw, 1.3rem); font-weight: 700; line-height: 1.35; }
.pitch-lede { margin-top: 0.8rem; color: var(--ink-dim); font-size: 1.08rem; line-height: 1.7; }
.pitch-loc { margin-top: 1rem; color: var(--ink-dim); font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; }
.swap { animation: swap 0.5s var(--ease) both; }
@keyframes swap { from { opacity: 0; transform: translateY(10px); } }

.cta-row { margin-top: 1.8rem; display: flex; flex-wrap: wrap; gap: 0.8rem; }
.btn {
  display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.75rem 1.35rem;
  border: 1px solid var(--line); border-radius: 999px; text-decoration: none;
  font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase;
  background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
}
.btn i { font-style: normal; transition: transform 0.25s ease; }
.btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn:hover i { transform: translateX(5px); }
.btn--solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn--solid:hover { background: transparent; color: var(--ink); }

/* instrument : Montpellier, maintenant */
.panel {
  position: relative; border: 1px solid var(--line); border-radius: 16px;
  background: rgba(255, 255, 255, 0.025);
  backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px) saturate(1.1);
}
.instrument { align-self: end; padding: 1.4rem 1.4rem 1.2rem; }
.eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim); }
.instrument-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.instrument-time { font-size: 0.85rem; font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }
.instrument-stat { margin-top: 0.9rem; display: flex; align-items: baseline; gap: 0.8rem; flex-wrap: wrap; }
.instrument-stat b { font-size: clamp(2.2rem, 4vw, 3.2rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.instrument-stat span { color: var(--ink-dim); font-size: 0.85rem; line-height: 1.4; max-width: 14rem; }
.solar { display: block; width: 100%; height: auto; margin-top: 0.8rem; overflow: visible; }
.solar .base, .tl .axis { stroke: rgba(255, 255, 255, 0.28); stroke-width: 1; }
.solar .tick, .tl .grid { stroke: rgba(255, 255, 255, 0.09); stroke-width: 1; }
.solar .area { fill: rgba(245, 245, 245, 0.09); }
.solar .curve { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.solar .now-line { stroke: rgba(255, 255, 255, 0.45); stroke-width: 1; stroke-dasharray: 3 3; }
.solar .now-dot { fill: var(--ink); stroke: var(--bg); stroke-width: 2; }
.solar .now-ring { fill: none; stroke: var(--ink); stroke-width: 1; transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
@keyframes ring { from { transform: scale(1); opacity: 0.8; } to { transform: scale(3.4); opacity: 0; } }
.solar text, .tl .yr { fill: var(--ink-dim); font-size: 10px; letter-spacing: 0.08em; }
.solar .probe { stroke: var(--ink); stroke-width: 1; opacity: 0; }
.instrument-foot { margin-top: 0.7rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; color: var(--ink-dim); font-size: 0.75rem; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.instrument-note { margin-top: 0.9rem; padding-top: 0.9rem; border-top: 1px solid var(--line); color: var(--ink-dim); font-size: 0.8rem; line-height: 1.6; }

/* relevé : quatre chiffres sourcés */
.figures {
  grid-column: 1 / -1; margin-top: clamp(1.8rem, 3.6vh, 3rem);
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.figure { padding: 1.3rem 1.4rem 1.4rem 0; }
.figure + .figure { padding-left: 1.4rem; border-left: 1px solid var(--line); }
.figure b { display: block; font-size: clamp(2rem, 4.2vw, 3.4rem); font-weight: 800; line-height: 1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.figure span { display: block; margin-top: 0.6rem; color: var(--ink-dim); font-size: 0.85rem; line-height: 1.5; max-width: 15rem; }

/* marquee */
.marquee {
  grid-column: 1 / -1; align-self: end; margin-top: clamp(2rem, 5vh, 3.5rem);
  width: 100vw; margin-left: -6vw; overflow: hidden; border-bottom: 1px solid var(--line); padding: 0.85rem 0;
}
.marquee-track { display: flex; width: max-content; animation: marquee 34s linear infinite; }
.marquee-track span { white-space: nowrap; text-transform: uppercase; letter-spacing: 0.35em; font-size: 0.75rem; color: var(--ink-dim); padding-right: 2rem; }
@keyframes marquee { to { transform: translateX(-50%); } }

/* ---------- sections ---------- */
.section { padding: clamp(5rem, 12vh, 8rem) 6vw 0; max-width: 92rem; margin: 0 auto; }
.section-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem 3rem; margin-bottom: clamp(1.6rem, 4vh, 2.6rem); }
.section h2 { font-size: clamp(2.4rem, 6vw, 4.5rem); font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase; line-height: 1; }
.section h2 em { font-style: normal; color: transparent; -webkit-text-stroke: 1.5px var(--ink); }
.section-sub { color: var(--ink-dim); font-size: 0.95rem; line-height: 1.6; max-width: 26rem; }

.reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.9s ease, transform 0.9s var(--ease); }
.reveal.is-inview { opacity: 1; transform: none; }

/* frise */
.tl-wrap { padding: 1.2rem 1.2rem 0.6rem; }
.tl-scroll { overflow-x: auto; scrollbar-width: thin; scrollbar-color: #333 transparent; }
.tl { display: block; width: 100%; min-width: 760px; height: auto; }
.tl .row-label { fill: var(--ink-dim); font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; }
.tl .yr { text-anchor: middle; font-size: 10.5px; font-variant-numeric: tabular-nums; }
.tl .seg-g { outline: none; }
.tl .seg-g rect { fill: rgba(245, 245, 245, 0.05); stroke: rgba(245, 245, 245, 0.26); stroke-width: 1; transition: fill 0.35s ease, stroke 0.35s ease; }
.tl .seg-g text { fill: var(--ink-dim); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; text-anchor: middle; pointer-events: none; transition: fill 0.35s ease; }
.tl .seg-g.approx rect { stroke-dasharray: 4 3; fill: transparent; }
.tl .seg-g.lit rect { fill: rgba(245, 245, 245, 0.2); stroke: rgba(245, 245, 245, 0.6); }
.tl .seg-g.lit text { fill: var(--ink); }
.tl .seg-g:hover rect { stroke: var(--ink); }
.tl .seg-g.sel rect { fill: var(--ink); stroke: var(--ink); stroke-dasharray: none; }
.tl .seg-g.sel text { fill: var(--bg); }
.tl .now { stroke: var(--ink); stroke-width: 1; }
.tl .now-label { fill: var(--ink); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; text-anchor: end; }
.tl .pulse { fill: var(--ink); filter: drop-shadow(0 0 5px #fff); animation: run 7s linear infinite; }
@keyframes run {
  0% { transform: translateX(var(--x0)); opacity: 0; }
  8%, 92% { opacity: 1; }
  100% { transform: translateX(var(--x1)); opacity: 0; }
}
.tl-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.6rem 2rem; padding: 0.4rem 0.2rem 0.6rem; color: var(--ink-dim); font-size: 0.75rem; letter-spacing: 0.04em; }

.tip {
  position: fixed; z-index: 50; pointer-events: none; padding: 0.55rem 0.8rem; border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(12, 12, 14, 0.92);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-size: 0.78rem; line-height: 1.45; opacity: 0; transition: opacity 0.15s ease;
  transform: translate(-50%, calc(-100% - 14px)); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.tip.is-on { opacity: 1; }
.tip small { display: block; color: var(--ink-dim); font-size: 0.72rem; }

.tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
.tabs button {
  border: 1px solid var(--line); border-radius: 999px; background: var(--glass);
  padding: 0.42rem 0.9rem; font-size: 0.76rem; letter-spacing: 0.04em; color: var(--ink-dim);
  transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
}
.tabs button:hover { color: var(--ink); border-color: rgba(255, 255, 255, 0.4); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* fiche du poste sélectionné */
.sheet { margin-top: 1rem; padding: clamp(1.4rem, 3vw, 2.4rem); display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 1.6rem clamp(2rem, 5vw, 4.5rem); }
.sheet-dates { display: inline-block; color: var(--ink-dim); font-size: 0.78rem; letter-spacing: 0.15em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 0.35rem 0.9rem; }
.sheet h3 { margin-top: 1.1rem; font-size: clamp(2rem, 4.4vw, 3.6rem); font-weight: 800; line-height: 0.98; letter-spacing: -0.01em; text-transform: uppercase; }
.sheet h3 em { font-style: normal; color: transparent; -webkit-text-stroke: 1.5px var(--ink); }
.sheet-role { margin-top: 0.9rem; font-weight: 600; font-size: 1.05rem; line-height: 1.4; }
.sheet-context { margin-top: 1rem; color: var(--ink-dim); font-size: 0.95rem; line-height: 1.7; }
.sheet-context a { color: var(--ink); }
.facts { list-style: none; counter-reset: fact; }
.facts li { counter-increment: fact; display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); padding: 0.85rem 0; border-top: 1px solid var(--line); color: var(--ink-dim); font-size: 0.98rem; line-height: 1.6; transition: color 0.35s ease; }
.facts li:last-child { border-bottom: 1px solid var(--line); }
.facts li::before { content: counter(fact, decimal-leading-zero); font-size: 0.72rem; letter-spacing: 0.1em; padding-top: 0.3rem; color: var(--ink-dim); }
.facts li.lit { color: var(--ink); }
.facts li.lit::before { content: "●"; font-size: 0.6rem; padding-top: 0.5rem; color: var(--ink); }
.facts-legend { margin-top: 0.8rem; color: var(--ink-dim); font-size: 0.75rem; letter-spacing: 0.04em; }
.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.4rem; }
.chips li { border: 1px solid rgba(245, 245, 245, 0.4); border-radius: 999px; padding: 0.36rem 0.85rem; font-size: 0.78rem; letter-spacing: 0.03em; background: var(--glass); }
.chips.dashed li { border-style: dashed; border-color: var(--line); color: var(--ink-dim); }

/* méthode */
.method { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.q { padding: 1.5rem; display: flex; flex-direction: column; gap: 2.4rem; justify-content: space-between; min-height: 11rem; }
.q p { font-size: clamp(1.15rem, 1.9vw, 1.5rem); font-weight: 700; line-height: 1.3; }
.method-wide { grid-column: span 2; padding: 1.5rem; }
.method-wide p, .method-self p { margin-top: 0.8rem; color: var(--ink-dim); line-height: 1.7; font-size: 0.98rem; }
.method-self { padding: 1.5rem; }
.flow { margin-top: 1.2rem; display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; }
.flow span { border: 1px solid var(--line); border-radius: 999px; padding: 0.3rem 0.7rem; }
.flow span.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.flow i { font-style: normal; color: var(--ink-dim); }

/* outils */
.tools { border-top: 1px solid var(--line); }
.tool-row { display: grid; grid-template-columns: 14rem minmax(0, 1fr); gap: 1rem 2rem; padding: 1.15rem 0; border-bottom: 1px solid var(--line); align-items: baseline; transition: opacity 0.35s ease; }
.tool-row dt { font-size: clamp(1.05rem, 1.8vw, 1.4rem); font-weight: 800; text-transform: uppercase; letter-spacing: 0.01em; color: var(--ink-dim); transition: color 0.35s ease; }
.tool-row dd { color: var(--ink-dim); line-height: 1.75; font-size: 0.98rem; transition: color 0.35s ease; }
.tool-row.lit dt, .tool-row.lit dd { color: var(--ink); }

/* contact + pied */
.contact h2 { text-transform: none; font-size: clamp(2.2rem, 5vw, 4rem); }
.contact p { margin-top: 1.2rem; color: var(--ink-dim); max-width: 36rem; line-height: 1.7; font-size: 1.05rem; }
.mail { display: inline-block; margin-top: 1.6rem; font-size: clamp(1.1rem, 2.5vw, 1.6rem); text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 0.2rem; transition: color 0.2s; }
.mail:hover { color: var(--ink-dim); }
.socials { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 2.2rem; }

function swap(el, html) {
  el.innerHTML = html;

  void el.offsetWidth; // relance l'animation
  el.classList.add('swap');
  // retirée une fois jouée, sinon elle rejoue à la sortie du mode sobriété
  el.addEventListener('animationend', () => el.classList.remove('swap'), { once: true });
}

/* =========================================================================
   INSTRUMENT — élévation solaire à Montpellier, calculée (pas mesurée).
   Approximation classique de l'almanach, précise à la minute près.
   ========================================================================= */
const LAT = 43.6108, LON = 3.8767, RAD = Math.PI / 180;
function sunElevation(ms) {
  const d = ms / 86400000 + 2440587.5 - 2451545.0;
  const g = (357.529 + 0.98560028 * d) * RAD;
  const L = (280.459 + 0.98564736 * d + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * RAD;
  const e = (23.439 - 0.00000036 * d) * RAD;
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
  const decl = Math.asin(Math.sin(e) * Math.sin(L));
  const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
  const ha = (gmst * 15 + LON) * RAD - ra;
  return Math.asin(Math.sin(LAT * RAD) * Math.sin(decl) + Math.cos(LAT * RAD) * Math.cos(decl) * Math.cos(ha)) / RAD;
}
function parisClock(date) {
  const [h, m, s] = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false })
    .format(date).split(':').map(Number);
  return { h: h % 24, m, s };
}
const fmtMin = (min) => {
  const h = Math.floor(min / 60), m = String(Math.round(min % 60)).padStart(2, '0');
  return state.lang === 'fr' ? `${h} h ${m}` : `${String(h).padStart(2, '0')}:${m}`;
};
const SOL = { x0: 6, x1: 314, y0: 10, y1: 100 };
let solar = null;
function computeSolar() {
  const now = new Date(), c = parisClock(now);
  const nowMin = c.h * 60 + c.m + c.s / 60;
  const midnight = now.getTime() - nowMin * 60000;
  const val = (min) => Math.max(0, Math.sin(sunElevation(midnight + min * 60000) * RAD));
  let peak = 0, rise = null, set = null;
  for (let m = 0; m < 1440; m++) {
    const up = sunElevation(midnight + m * 60000) > -0.833;
    if (up && rise === null) rise = m;
    if (up) set = m;
    peak = Math.max(peak, val(m));
  }
  solar = { nowMin, val, peak, rise, set, pct: Math.round((val(nowMin) / peak) * 100) };
}
function renderSolar() {
  computeSolar();
  const { nowMin, val, peak, rise, set, pct } = solar;
  const X = (min) => SOL.x0 + (min / 1440) * (SOL.x1 - SOL.x0);
  const Y = (v) => SOL.y1 - (v / peak) * (SOL.y1 - SOL.y0);
  let d = '';
  for (let m = 0; m <= 1440; m += 5) d += `${m ? 'L' : 'M'}${X(m).toFixed(1)},${Y(val(m)).toFixed(1)}`;
  const nx = X(nowMin), ny = Y(val(nowMin));
  let s = '';
  [0, 6, 12, 18, 24].forEach((h) => {
    s += `<line class="tick" x1="${X(h * 60)}" x2="${X(h * 60)}" y1="${SOL.y0}" y2="${SOL.y1}"/>` +
      `<text x="${X(h * 60)}" y="120" text-anchor="${h === 0 ? 'start' : h === 24 ? 'end' : 'middle'}">${h} h</text>`;
  });
  s += `<path class="area" d="${d}L${SOL.x1},${SOL.y1}L${SOL.x0},${SOL.y1}Z"/>` +
    `<line class="base" x1="${SOL.x0}" x2="${SOL.x1}" y1="${SOL.y1}" y2="${SOL.y1}"/>` +
    `<path class="curve" d="${d}"/>` +
    `<line class="now-line" x1="${nx}" x2="${nx}" y1="${SOL.y0}" y2="${SOL.y1}"/>` +
    `<line class="probe" id="probe" x1="0" x2="0" y1="${SOL.y0}" y2="${SOL.y1}"/>` +
    `<circle class="now-ring" cx="${nx}" cy="${ny}" r="4"/><circle class="now-dot" cx="${nx}" cy="${ny}" r="4"/>`;
  $('#solar').innerHTML = s;
  $('#solar-time').textContent = fmtMin(Math.floor(nowMin));
  $('#solar-pct').textContent = pct + (state.lang === 'fr' ? ' %' : '%');
  $('#solar-label').textContent = pct > 0 ? t('solarDay') : t('solarNight').replace('{t}', fmtMin(rise));
  $('#solar-rise').textContent = t('solarRise').replace('{t}', fmtMin(rise));
  $('#solar-set').textContent = t('solarSet').replace('{t}', fmtMin(set));
}

});
$('#tl').addEventListener('pointerleave', hideTip);
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (b) select(b.dataset.id, true); });
$('#tabs').addEventListener('keydown', (e) => {
  const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (!step) return;
  e.preventDefault();
  const i = ORDER.indexOf(state.sel);
  select(ORDER[(i + step + ORDER.length) % ORDER.length], true);
  $(`#tabs [data-id="${state.sel}"]`).focus();
});

$('#solar').addEventListener('pointermove', (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  const ux = ((e.clientX - r.left) / r.width) * 320;
  const min = Math.min(1440, Math.max(0, ((ux - SOL.x0) / (SOL.x1 - SOL.x0)) * 1440));
  const probe = $('#probe');
  probe.setAttribute('x1', ux); probe.setAttribute('x2', ux); probe.style.opacity = 0.5;
  showTip(e.clientX, r.top + 8, `${fmtMin(min)}<small>${Math.round((solar.val(min) / solar.peak) * 100)}${state.lang === 'fr' ? ' %' : '%'}</small>`);
});
$('#solar').addEventListener('pointerleave', () => { hideTip(); const p = $('#probe'); if (p) p.style.opacity = 0; });

addEventListener('resize', () => { placeThumb(); revealSel(); });
addEventListener('scroll', () => $('#header').classList.toggle('is-scrolled', scrollY > 40), { passive: true });
setInterval(renderSolar, 60000);

/* reveals au scroll */
const io = new IntersectionObserver((entries) => entries.forEach((en) => {
  if (en.isIntersecting) { en.target.classList.add('is-inview'); io.unobserve(en.target); }
}), { rootMargin: '-6% 0px -8% 0px' });
$$('.reveal').forEach((el) => io.observe(el));

/* loader : 1250 ms, au chargement uniquement */
(() => {
  const loader = $('#loader'), start = performance.now(), min = reduce ? 200 : 1250;
  const hide = () => { loader.classList.add('is-done'); setTimeout(() => loader.remove(), 800); };
  const done = () => setTimeout(hide, Math.max(0, min - (performance.now() - start)));
  document.readyState === 'complete' ? done() : addEventListener('load', done, { once: true });
  setTimeout(hide, 6000); // filet de sécurité
})();

/* curseur anneau */
(() => {
  const c = $('#cursor');
  if (!matchMedia('(pointer: fine)').matches) return;
  let txp = innerWidth / 2, typ = innerHeight / 2, x = txp, y = typ;
  const hot = 'a, button, .seg-g';
  addEventListener('pointermove', (e) => { txp = e.clientX; typ = e.clientY; c.classList.add('is-visible'); }, { passive: true });
  document.addEventListener('mouseleave', () => c.classList.remove('is-visible'));
  addEventListener('mousedown', () => c.classList.add('is-down'));
  addEventListener('mouseup', () => c.classList.remove('is-down'));
  document.addEventListener('mouseover', (e) => c.classList.toggle('is-hover', !!e.target.closest(hot)));
  (function follow() {
    const k = state.sober || reduce ? 1 : 0.2;
    x += (txp - x) * k; y += (typ - y) * k;
    c.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    requestAnimationFrame(follow);
  })();
})();

/* premier rendu */
renderStatic(); renderLens(); renderTimeline(); renderTabs(); renderSheet(); renderTools(); renderSolar();
addEventListener('load', () => { renderWeight(); placeThumb(); revealSel(); });
document.fonts && document.fonts.ready.then(placeThumb);
</script>
</body>
